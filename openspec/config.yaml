schema: spec-driven

# Task context is a router; policies and implementation facts live in the linked docs.
context: |
  Project: Klaudia and Rafał's wedding website, https://klaudiarafal.pl.
  This is an existing static Astro site, not a pending MkDocs migration.
  Read paths relative to the repository root:
    - AGENTS.md: task routing and completion pointers.
    - docs/invariants.md: authoritative product boundaries; preserve them in proposals.
    - docs/contributing.md: Klaudia/Rafał modes, scope/authorization, OpenSpec and safe parallelism.
    - docs/coding-standards.md: content, naming, Astro/client code, styling and formatting.
    - docs/architecture.md: current routes, content owners and build/deploy wiring.
    - docs/flows.md: browser transitions and state lifetime.
    - docs/api.md: API/external boundaries and build-time environment configuration.
    - docs/setup.md: fresh-checkout prerequisites and startup.
    - docs/editing-session.md: preview, resume, photos, publication and restoration operations.
    - docs/quality.md: proportionate verification and actual automation.
    - docs/repository-inventory.md: audited coverage and reference-document correspondence.
    - docs/roadmap.md: further investigation and unresolved content choices, separate from completed changes.
    - docs/adr/0002-record-architecture-decisions.md: decision-record practice and template.
  openspec/specs/ contains the intended behavior contracts. Check the working tree
  and relevant spec together; historical inconsistencies are not new requirements.
  Planning artifacts under openspec/changes/ are local and ignored by Git.

rules:
  proposal:
    - Identify affected invariants and contracts by reference rather than copying policy.
    - Distinguish observed implementation, requested changes, and unresolved decisions.
  tasks:
    - Break work into independently verifiable steps with explicit file ownership.
    - Choose checks from docs/quality.md for the change scope; report the checked snapshot.
    - Deployment checks never authorize publication; use docs/contributing.md and docs/editing-session.md before any dispatch.
