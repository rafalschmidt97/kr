<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mieszkanie 194: nowy adres</title>
    <link rel="canonical" href="https://rafalschmidt97.github.io/apartament-nowopark-194/" />
    <noscript><meta http-equiv="refresh" content="0; url=https://rafalschmidt97.github.io/apartament-nowopark-194/" /></noscript>
    <script>
      // The apartment model moved to its own site. Browser storage is per site, so the layout and settings saved
      // at this address travel along in the URL fragment (never sent to a server); the model stores them on its
      // first load (rafalschmidt97/apartament-nowopark-194, src/app/migrate.ts).
      (function () {
        var target = 'https://rafalschmidt97.github.io/apartament-nowopark-194/';
        var data = {};
        var found = false;
        try {
          ['settings-v2', 'layout-v3', 'tab'].forEach(function (k) {
            var v = localStorage.getItem('m194:' + k);
            if (v !== null) {
              data[k] = v;
              found = true;
            }
          });
          if (found) {
            var bytes = new TextEncoder().encode(JSON.stringify(data));
            var bin = '';
            for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            target += '#m194-migrate=' + encodeURIComponent(btoa(bin));
          }
        } catch (e) {
          /* storage unavailable: just go to the new address */
        }
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>
      Model mieszkania jest pod nowym adresem:
      <a href="https://rafalschmidt97.github.io/apartament-nowopark-194/">rafalschmidt97.github.io/apartament-nowopark-194</a>
    </p>
  </body>
</html>
